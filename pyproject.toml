[project]
name = "ai-eval-framework"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "deepeval==4.2.2",
    "openai==3.13.0",
    "python-dotenv==1.2.3",
    "tqdm==4.70.1",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
strict = ["jsonschema>=4.20"]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "pytest-xdist==3.8.0",
       "pytest-repeat==0.9.4", "pytest-rerunfailures==16.6.1",
       "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]
all = ["ai-eval-framework[strict,dev]"]

[project.scripts]
ai-eval = "main:main"

[tool.setuptools.packages.find]
include = ["core*", "config*", "utils*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "BLE"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true